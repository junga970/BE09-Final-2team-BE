apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
  namespace: momnect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-service
  template:
    metadata:
      labels:
        app: discovery-service
    spec:
      containers:
        - name: discovery-service
          image: junga970/discovery-service:latest
          ports:
            - containerPort: 8761
          envFrom:
            - secretRef:
                name: app-secret
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-service
  namespace: momnect
spec:
  selector:
    app: discovery-service
  ports:
    - port: 8761        # 클러스터 내부에서 discovery-service:8761 로 접근
      targetPort: 8761  # 컨테이너 포트
      nodePort: 30061   # EC2 외부 접근 (http://<EC2_IP>:30061)
  type: NodePort

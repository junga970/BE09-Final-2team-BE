apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-service
  namespace: momnect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: post-service
  template:
    metadata:
      labels:
        app: post-service
    spec:
      containers:
        - name: post-service
          image: junga970/post-service:dev-1
          envFrom:
            - secretRef:
                name: app-secret
---
apiVersion: v1
kind: Service
metadata:
  name: post-service
  namespace: momnect
spec:
  selector:
    app: post-service
  clusterIP: None   # Headless (Eureka 의존)
  ports:
    - port: 80
      targetPort: 80   # placeholder

apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: momnect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: junga970/user-service:dev-1
          envFrom:
            - secretRef:
                name: app-secret
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: momnect
spec:
  selector:
    app: user-service
  clusterIP: None   # Headless (Eureka 의존)
  ports:
    - port: 80
      targetPort: 80   # placeholder
